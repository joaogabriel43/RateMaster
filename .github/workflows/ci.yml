name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ====================================================================
  # Job 1: Build & Test
  # ====================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build and verify with Maven
        run: mvn clean verify -B -V --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # ====================================================================
  # Job 2: Security Scanning (Native Binaries)
  # ====================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # ---------------------------------------------------------------
      # GitLeaks - Secret Detection (CLI Binary)
      # NOTE: We intentionally DO NOT use gitleaks-action@v2 due to
      # commercial licensing restrictions. The CLI binary is used instead.
      # ---------------------------------------------------------------
      - name: Install GitLeaks CLI
        run: |
          # Pinned version: installing "latest" caused breakage when the CLI
          # dropped the `--source` flag from the `git` subcommand. Pin to avoid drift.
          GITLEAKS_VERSION="8.30.1"
          echo "Installing GitLeaks v${GITLEAKS_VERSION}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run GitLeaks scan
        # Repo path is positional in current GitLeaks (`gitleaks git [flags] [repo]`);
        # the legacy `--source` flag was removed.
        run: gitleaks git . --verbose --exit-code 1

      # ---------------------------------------------------------------
      # Trivy - Vulnerability Scanner (CLI Binary)
      # NOTE: We intentionally DO NOT use trivy-action wrapper to ensure
      # direct control over severity flags and filtering behavior.
      # ---------------------------------------------------------------
      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            --format table \
            .

      # ---------------------------------------------------------------
      # Install reactor artifacts so cross-module dependencies
      # (e.g. ratemaster-core) resolve for the Maven-based analyzers below.
      # Without this, `dependency-check:check` fails to resolve
      # ratemaster-core:<version> for the starter module.
      # ---------------------------------------------------------------
      - name: Build and install modules
        run: mvn install -B -DskipTests --no-transfer-progress

      # ---------------------------------------------------------------
      # OWASP Dependency-Check (Maven Plugin)
      # NVD data is cached across runs; set an optional NVD_API_KEY repository
      # secret to make the NVD update dramatically faster and more reliable.
      # ---------------------------------------------------------------
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.dc-data
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn dependency-check:check -B --no-transfer-progress
          -DdataDirectory="${{ github.workspace }}/.dc-data"
          ${NVD_API_KEY:+-DnvdApiKey="$NVD_API_KEY"}

      # ---------------------------------------------------------------
      # SpotBugs - Static Analysis (Maven Plugin)
      # ---------------------------------------------------------------
      - name: Compile for SpotBugs analysis
        run: mvn compile -B --no-transfer-progress

      - name: Run SpotBugs analysis
        run: mvn spotbugs:check -B --no-transfer-progress

  # ====================================================================
  # Job 3: Publish to GitHub Packages
  # ====================================================================
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: security-scan
    # Publish releases from version tags only (v*), not on every push to main.
    # This prevents accidental re-deploys of the same release version on doc/CI commits.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: mvn deploy -B -DskipTests --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
