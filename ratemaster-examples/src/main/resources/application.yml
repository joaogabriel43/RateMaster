# RateMaster Examples - Application Configuration
spring:
  application:
    name: ratemaster-examples

  # Redis configuration (required for RateMaster)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080
